<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#0d213f" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-opacity="0.35" />
  
  <!-- Monogram FG -->
  <text 
    x="256" 
    y="332" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="240" 
    font-weight="900" 
    letter-spacing="-4" 
    fill="#ffffff"
  >
    FG
  </text>
  
  <!-- Subtle turquoise accent dot -->
  <circle cx="410" cy="316" r="22" fill="#2dd4bf" />
